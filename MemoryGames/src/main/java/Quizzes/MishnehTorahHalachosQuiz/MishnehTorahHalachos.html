<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mishneh Torah Halachos Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="quiz-container">
    <div class="quiz-header">
        <a href="../../LandingPage/index.html" class="back-btn">← Back to Menu</a>
        <h1>Mishneh Torah Halachos Quiz</h1>
        <div id="timer" class="timer">15:00</div>
    </div>

    <div class="filter-area">
        <label for="book-filter">Book (Sefer):</label>
        <select id="book-filter"></select>
    </div>

    <div class="input-area">
        <button id="control-btn" class="start-btn">Start Game</button>

        <input type="text" id="answer-input" placeholder="Type a set of halachos (Hebrew, transliteration, or English)..." autocomplete="off" disabled>
        <div id="message" class="message-box">Press Start to Begin!</div>
        <div id="score">0 / ...</div>
    </div>

    <div id="game-board" class="melachos-grid">
    </div>
</div>

<script src="MishnehTorahHalachos.js"></script>
</body>
</html>
