<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parsha Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="quiz-container">
    <div class="quiz-header">
        <a href="../../LandingPage/index.html" class="back-btn">← Menu</a>
        <h1>Parsha Quiz</h1>
        <div id="timer" class="timer">06:13</div>
    </div>

    <div class="input-area">
        <div class="controls-row">
            <button id="control-btn" class="start-btn">Start Game</button>
            <input type="text" id="answer-input" placeholder="Type a Parsha (Hebrew, transliteration, or English)..." autocomplete="off" disabled>
            <div id="score" class="score-pill">0 / 54</div>
        </div>
        <div id="message" class="message-box">Press Start to Begin!</div>
    </div>

    <div id="game-board" class="mishna-grid">
    </div>
</div>

<script src="Parsha.js"></script>
</body>
</html>
